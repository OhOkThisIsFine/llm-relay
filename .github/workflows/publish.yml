name: Publish to npm

# Publishes via npm Trusted Publishing (OIDC, `id-token: write`) — there is no npm token in this
# repository, which is exactly why the *trigger* is the credential. Anything that can start this
# job can publish llm-relay, so the trigger surface is deliberately narrow.
#
# A `v*` tag push is the ONLY path to the registry. The `release: published` trigger was removed:
# it was a second, independent way in, and a release created from a tag fired both, producing a
# duplicate publish attempt that fails confusingly on the version already being live.
#
# Four gates stand between a tag push and `npm publish`:
#   1. job-level `if` — this repository only, and only a ref under `refs/tags/v*`. A fork's tag
#      push and any branch push never reach the job.
#   2. `environment: npm-publish` — GitHub evaluates the environment's protection rules before the
#      job starts, and only jobs naming it can mint the OIDC token scoped to that environment.
#      ⚠ The rules themselves live in repo settings, NOT here: Settings → Environments →
#      npm-publish must carry required reviewers and/or a protected-tag deployment rule. Without
#      them the environment is an audit trail with no gate — and GitHub silently auto-creates the
#      environment on first run, so its mere presence here proves nothing.
#   3. "tag is contained in the default branch" — a tag pointing at an unmerged, unreviewed commit
#      cannot publish, which is the actual attack the bare `v*` trigger allowed.
#   4. "tag matches package.json version" — a tag that disagrees with the manifest is a mistake,
#      and on npm a mistake is permanent (a published version cannot be replaced).
#
# Actions are pinned to immutable commit SHAs; the trailing `# vX.Y.Z` is the human-readable
# version. A mutable `@v4` lets the action's owner change what executes inside a job holding a
# token good for publishing this package.

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

# No ambient permissions; the publish job grants itself the minimum it needs.
permissions: {}

jobs:
  publish:
    if: github.repository == 'OhOkThisIsFine/llm-relay' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: npm-publish
      url: https://www.npmjs.com/package/llm-relay
    permissions:
      contents: read
      id-token: write # npm Trusted Publishing
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Nothing after this step needs git write access, and `npm ci`/`npm test` must not
          # inherit a usable push credential.
          persist-credentials: false

      - name: Refuse a tag whose commit is not on the default branch
        env:
          GH_TOKEN: ${{ github.token }}
          BASE: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          if [ -z "${BASE:-}" ]; then
            echo "::error::could not determine the default branch; refusing to publish"
            exit 1
          fi
          # `compare` is used instead of `git merge-base` on purpose: the checkout above is
          # shallow and carries no credentials, so the ancestry question is answered by the API.
          # identical = the tag IS the branch head; behind = the tag is an ancestor of it.
          status=$(gh api "repos/${GITHUB_REPOSITORY}/compare/${BASE}...${GITHUB_SHA}" --jq .status)
          echo "compare ${BASE}...${GITHUB_SHA} -> ${status}"
          case "$status" in
            identical | behind) ;;
            *)
              echo "::error::refusing to publish ${GITHUB_REF_NAME}: its commit is not contained in ${BASE} (compare status: ${status})"
              exit 1
              ;;
          esac

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          # Deliberately no `registry-url`: it writes an `_authToken=${NODE_AUTH_TOKEN}` line into
          # .npmrc, and with no token set that empty auth breaks Trusted Publishing.

      - name: Refuse a tag that disagrees with package.json
        run: |
          set -euo pipefail
          want="v$(node -p "require('./package.json').version")"
          echo "tag=${GITHUB_REF_NAME} package.json=${want}"
          if [ "${GITHUB_REF_NAME}" != "${want}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match package.json version ${want}"
            exit 1
          fi

      # Trusted Publishing requires npm >= 11.5.1. Pinned to the 11.x line rather than `latest` so
      # a future major cannot change publish semantics under this workflow without a code change.
      - run: npm install -g npm@^11.5.1
      # --ignore-scripts: a publish job holding an OIDC token must not execute dependency install
      # hooks. This package's own postinstall only acts on global installs, so nothing is lost.
      - run: npm ci --ignore-scripts
      - run: npm run build
      # Artifact smoke test: npm pack, install into a clean directory, and exercise the
      # installed binary against every runtime asset it loads from outside dist/.
      # This is the only gate that verifies the `files` whitelist is complete — CI's
      # build/check runs against the source tree, not the packed tarball, and would
      # miss a missing tier-data.json or skills/ directory in the published artifact.
      - name: Smoke-test the packed artifact
        run: |
          set -euo pipefail

          # --- pack ---------------------------------------------------------------
          WORKSPACE="$PWD"
          if command -v cygpath > /dev/null 2>&1; then
            WORKSPACE="$(cygpath -u "${WORKSPACE}")"
          fi
          TARBALL=""
          DEST=""
          NEG_DEST=""
          NEG_OUTPUT=""
          cleanup() {
            cd "${WORKSPACE}"
            [ -z "${DEST}" ] || rm -rf -- "${DEST}"
            [ -z "${NEG_DEST}" ] || rm -rf -- "${NEG_DEST}"
            [ -z "${NEG_OUTPUT}" ] || rm -f -- "${NEG_OUTPUT}"
            [ -z "${TARBALL}" ] || rm -f -- "${TARBALL}"
          }
          trap cleanup EXIT

          TARBALL_NAME="$(npm pack 2>&1 | tail -1)"
          TARBALL="${WORKSPACE}/${TARBALL_NAME}"
          echo "packed: ${TARBALL}"

          # --- install into a clean temp directory --------------------------------
          DEST="$(mktemp -d)"
          tar xzf "${TARBALL}" -C "${DEST}" --strip-components=1
          cd "${DEST}"
          npm install --ignore-scripts > /dev/null 2>&1

          # Verify the binary itself is present
          test -f "${DEST}/dist/cli.js" || { echo "::error::dist/cli.js missing from tarball"; exit 1; }
          echo "dist/cli.js: present"

          # --- tier-data.json: must be present and loadable ------------------------
          # loadTierData() resolves ../docs/tier-data.json relative to dist/tier-data.js.
          # Direct check: the file must exist and parse to a non-empty models array.
          node -e "
          const { loadTierData } = require('./dist/tier-data.js');
          const data = loadTierData({ force: true });
          if (!data || !Array.isArray(data.models) || data.models.length === 0) {
            console.error('::error::tier-data.json missing or empty');
            process.exit(1);
          }
          console.log('tier-data.json: present, models=' + data.models.length);
          "

          # --- package.json: version command must report the published version -------
          VERSION="$(node -p "require('./package.json').version")"
          BIN_VERSION="$(node "${DEST}/dist/cli.js" --version 2>&1 | tr -d '\n')"
          if [ "${BIN_VERSION}" != "${VERSION}" ]; then
              echo "::error::version mismatch: package.json=${VERSION}, binary reports=${BIN_VERSION}"
              exit 1
          fi
          echo "version: ${BIN_VERSION} (matches package.json)"

          # --- skills directory: at least the entrypoint file ships ------------------
          # npm pack wraps contents in package/; strip that prefix when listing.
          SKILL_PRESENT=0
          while IFS= read -r line; do
            if [ "$line" = "skills/llm-relay/SKILL.md" ]; then
              SKILL_PRESENT=1
              break
            fi
          done < <(tar tzf "${TARBALL}" | sed 's|^package/||')
          if [ "$SKILL_PRESENT" -ne 1 ]; then
            echo "::error::skills/llm-relay/SKILL.md missing from tarball — postinstall hook cannot install the Claude Code / Codex skill"
            exit 1
          fi
          echo "skills/llm-relay/SKILL.md: present in tarball"

          # --- report tarball contents for diagnostics ---------------------------------
          echo "--- tarball contents ---"
          tar tzf "${TARBALL}" | sort

          cd "${WORKSPACE}"
          rm -rf -- "${DEST}"
          DEST=""

          # --- negative test: tier-data.json absent must FAIL ------------------------
          echo ""
          echo "--- negative test: tier-data.json absent ---"

          NEG_DEST="$(mktemp -d)"
          tar xzf "${TARBALL}" -C "${NEG_DEST}" --strip-components=1
          cd "${NEG_DEST}"
          npm install --ignore-scripts > /dev/null 2>&1
          rm -f "${NEG_DEST}/docs/tier-data.json"
          NEG_OUTPUT="$(mktemp)"

          # This MUST fail with the expected asset-detection error, not an unrelated runtime error.
          if node -e "
          const { loadTierData } = require('./dist/tier-data.js');
          const data = loadTierData({ force: true });
          if (!data || !Array.isArray(data.models) || data.models.length === 0) {
            console.error('::error::tier-data.json missing or empty');
            process.exit(1);
          }
          console.log('tier-data.json: present, models=' + data.models.length);
          " > "${NEG_OUTPUT}" 2>&1; then
            echo "::error::tier-data.json absence was NOT detected — smoke step would silently pass with the asset missing"
            echo "negative test output:"
            cat "${NEG_OUTPUT}"
            exit 1
          fi

          cat "${NEG_OUTPUT}"
          if ! grep -Fq "::error::tier-data.json missing or empty" "${NEG_OUTPUT}"; then
            echo "::error::negative tier-data probe failed for an unexpected reason"
            exit 1
          fi
          echo "PASS-AS-EXPECTED: tier-data.json absent correctly detected"

          cd "${WORKSPACE}"
          rm -rf -- "${NEG_DEST}"
          NEG_DEST=""
          rm -f -- "${NEG_OUTPUT}" "${TARBALL}"
          NEG_OUTPUT=""
          TARBALL=""
          trap - EXIT
      # `check` is typecheck + the suite. Publishing was previously gated on the suite alone.
      - run: npm run check
      - run: npm publish --access public
