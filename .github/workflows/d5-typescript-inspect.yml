name: Inspect TypeScript 7 launcher

on:
  push:
    branches: ["d5/typescript-7"]

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Inspect native compiler
        shell: bash
        run: |
          echo "root-api=$(node --input-type=module -e "import ts from 'typescript'; process.stdout.write(ts.version)")"
          echo "native-manifest=$(node --input-type=module -e "import p from '@typescript/native/package.json' with {type:'json'}; process.stdout.write(p.version)")"
          echo "--- bin/tsc ---"
          sed -n '1,120p' node_modules/@typescript/native/bin/tsc
          echo "--- direct launcher ---"
          node node_modules/@typescript/native/bin/tsc --version
          echo "--- npm bin winner ---"
          ./node_modules/.bin/tsc --version
