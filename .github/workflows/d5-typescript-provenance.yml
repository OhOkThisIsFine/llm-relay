name: Verify TypeScript 7 split

on:
  push:
    branches: ["d5/typescript-7"]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Compiler and API identities
        shell: bash
        run: |
          echo "compiler=$(${PWD}/node_modules/.bin/tsc --version)"
          node --input-type=module -e "import ts from 'typescript'; console.log('api=' + ts.version)"
          test "$(${PWD}/node_modules/.bin/tsc --version)" = "Version 7.0.2"
          node --input-type=module -e "import ts from 'typescript'; if (!ts.version.startsWith('6.0.')) process.exit(1)"
      - run: npm run build:server
