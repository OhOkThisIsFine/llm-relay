name: Capture Vite 8 bundle graph

on:
  push:
    branches: ["d5/vite-8"]

permissions:
  contents: write

jobs:
  graph:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build:dashboard
      - name: Commit captured graph
        shell: bash
        run: |
          cp dist/dashboard/.vite/dashboard-bundle-graph.json .vite8-bundle-graph.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .vite8-bundle-graph.json
          git commit -m "chore(d5): capture Vite 8 bundle graph"
          git push origin HEAD:d5/vite-8
