# Example LiteLLM config for running behind repair-proxy.
#
#   pip install 'litellm[proxy]'
#   litellm --config docs/litellm-config.example.yaml --port 4000
#
# LiteLLM owns ALL provider translation, routing, retries, and fallbacks; it
# serves the Anthropic Messages format on /v1/messages for every model below.
# repair-proxy sits in front and only validates/repairs tool calls.
#
# The model_name entries alias the Claude tier ids the `claude` CLI sends, so
# repair-proxy can pass the client's model straight through (no backend.model
# rewrite needed). Point them at whatever provider models you actually use.

model_list:
  # Main loop model — what claude-opus-*/claude-sonnet-* requests resolve to.
  - model_name: "claude-*"
    litellm_params:
      model: nvidia_nim/z-ai/glm-5.2
      api_key: os.environ/NVIDIA_API_KEY

  # Cheap model for the repair-proxy reshaper (config.reshaper.model: "reshaper").
  - model_name: reshaper
    litellm_params:
      model: nvidia_nim/openai/gpt-oss-20b
      api_key: os.environ/NVIDIA_API_KEY

litellm_settings:
  # Router-level retry/fallback lives here (transport failures — 429/5xx/timeouts).
  num_retries: 2
  request_timeout: 120

# Optional: require a key from repair-proxy (set LITELLM_API_KEY to match).
# general_settings:
#   master_key: os.environ/LITELLM_MASTER_KEY
